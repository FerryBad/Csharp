<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="C# Buddy — learn C# from absolute beginner to mini projects, one level at a time.">
  <title>C# Buddy — C# Levels</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><span class="bear-mini">🐻</span><strong><span>C#</span> Buddy</strong></a>
  <div class="search"><span>⌕</span><input id="search" placeholder="Search levels..." aria-label="Search levels"></div>
  <div class="top-right">
    <span class="progress-label">Course Progress</span>
    <div class="top-progress"><i id="topProgress"></i></div>
    <b id="percent">0%</b>
    <button id="theme" class="icon-btn" aria-label="Toggle dark mode">☾</button>
    <span class="avatar">🐻</span><span class="learner">Learner</span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="main-nav">
      <button class="home-btn" id="homeBtn">⌂ <span>Course Home</span></button>
      <h3>YOUR LEVELS</h3>
      <div id="levelNav"></div>
      <h3 class="more">PRACTICE</h3>
      <button id="practiceBtn" class="side-link">⌘ <span>Practice Zone</span></button>
      <button id="projectBtn" class="side-link">🎮 <span>Final Project</span></button>
      <h3 class="more">MORE</h3>
      <button class="side-link">📖 <span>C# Cheat Sheet</span></button>
      <button class="side-link">⚙ <span>Settings</span></button>
    </nav>
    <div class="sidebar-buddy">
      <img src="mascot.png" alt="C# Buddy teddy bear">
      <div><b id="sideMessage">Let's learn!</b><small>One level at a time ♥</small></div>
    </div>
  </aside>

  <main id="main">
    <section id="courseHome" class="home-screen"></section>
    <section id="levelScreen" hidden></section>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
